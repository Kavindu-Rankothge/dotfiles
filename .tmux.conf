set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind | split-window -h
bind - split-window -v

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n C-h resize-pane -L 5
bind -n C-j resize-pane -D 5
bind -n C-k resize-pane -U 5
bind -n C-l resize-pane -R 5

bind c new-window
bind n next-window
bind p previous-window
bind w list-windows

bind d detach-client
bind x kill-pane
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g mouse on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-option -g history-limit 10000

set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33
set -g status-bg colour240
set -g status-fg colour255

setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi q   send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || xsel --clipboard --input 2>/dev/null || pbcopy"
bind P paste-buffer

set -g word-separators " @\"'()[]{}"
